name: Diagnose Chromium browser contexts

on:
  push:
    branches: [diagnose-browser-context-ci]

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  browser-context:
    name: Chromium context (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Download the exact canonical frontend artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34736125947 \
            --repo "$GITHUB_REPOSITORY" \
            --name frontend-public-24b56c38583168c53a69b4ff2137a0b988517a9e-1 \
            --dir apps/server/cmd/openpost/public
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Generate an isolated config with the original test settings
        run: |
          cat > tests/app/.browser-context-diagnostic.config.ts <<'EOF'
          import { resolve } from 'node:path';
          import base from './playwright.config';

          export default {
            ...base,
            testDir: resolve(process.cwd(), 'tests/app'),
            reporter: [['list'], ['github']],
            workers: 1,
            retries: 0,
            projects: base.projects?.map((project) => {
              const args = project.use?.launchOptions?.args ?? [];
              if (!args.includes('--use-angle=swiftshader')) {
                throw new Error('expected the base SwiftShader ANGLE flag');
              }
              return {
                ...project,
                use: {
                  ...project.use,
                  channel: 'chromium',
                  launchOptions: {
                    ...project.use?.launchOptions,
                    args: args.map((arg) =>
                      arg === '--use-angle=swiftshader' ? '--use-angle=swiftshader-webgl' : arg
                    )
                  }
                }
              };
            })
          };
          EOF
      - name: Compare desktop Social Set and export behavior with WebGL-only SwiftShader
        env:
          OPENPOST_E2E_PREBUILT: "1"
          OPENPOST_DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
          DEBUG: pw:browser
          DEBUG_COLORS: "0"
        shell: bash
        run: |
          set -u
          diagnostics="$RUNNER_TEMP/browser-context-diagnostic"
          mkdir -p "$diagnostics"
          printf 'variant=%s\nangle_flag=swiftshader-webgl\ntrace_screenshots=true\nsource_revision=%s\nrun_start_utc=%s\n' \
            "$OPENPOST_DIAGNOSTIC_VARIANT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            > "$diagnostics/run.txt"
          vmstat -t 5 > "$diagnostics/vmstat.log" 2>&1 &
          vmstat_pid=$!
          (
            while true; do
              date -u +'%FT%TZ'
              uptime
              free -m
              ps -eo pid,ppid,stat,pcpu,pmem,rss,etimes,comm | \
                awk 'NR == 1 || /chrome|playwright|bun|node|go/'
              sleep 5
            done
          ) > "$diagnostics/processes.log" 2>&1 &
          process_pid=$!
          set +e
          bunx playwright test integration-settings.spec.ts \
            --config tests/app/.browser-context-diagnostic.config.ts \
            --grep 'Discord Social Set defaults persist at 1440px' \
            --repeat-each=3 --workers=1 --retries=0 \
            --output "$diagnostics/social-set-results" \
            > "$diagnostics/social-set-stdout.log" 2> "$diagnostics/social-set-stderr.log"
          social_set_status=$?
          bunx playwright test video-editor.spec.ts video-editor-shaders.spec.ts \
            --config tests/app/.browser-context-diagnostic.config.ts \
            --grep 'Video Editor quick export saves an MP4 in the workspace|shader clips preserve edits, seek and export an MP4' \
            --workers=1 --retries=0 \
            --output "$diagnostics/export-results" \
            > "$diagnostics/export-stdout.log" 2> "$diagnostics/export-stderr.log"
          export_status=$?
          set -e
          printf 'run_end_utc=%s\nsocial_set_exit_code=%s\nexport_exit_code=%s\n' \
            "$(date -u +%FT%TZ)" "$social_set_status" "$export_status" \
            >> "$diagnostics/run.txt"
          kill "$vmstat_pid" "$process_pid" 2>/dev/null || true
          wait "$vmstat_pid" "$process_pid" 2>/dev/null || true
          cat "$diagnostics/social-set-stdout.log" "$diagnostics/export-stdout.log"
          if [ "$social_set_status" -ne 0 ]; then
            tail -n 100 "$diagnostics/social-set-stderr.log"
          fi
          if [ "$export_status" -ne 0 ]; then
            tail -n 100 "$diagnostics/export-stderr.log"
          fi
          if [ "$social_set_status" -ne 0 ] || [ "$export_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload both passing and failing diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-context-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browser-context-diagnostic
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
