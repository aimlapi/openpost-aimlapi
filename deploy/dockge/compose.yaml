# Dockge stack for OpenPost. Dockge manages plain Compose files on disk, so
# this is the canonical single-container setup with no platform extras.
#
# Install: in Dockge choose "Create Stack", name it "openpost", paste this
# file as compose.yaml, then add a matching `.env` file in the stack editor
# with one line per ${...} value below (see the guide for a template).
# File layout on the host (default stacks directory):
#   /opt/stacks/openpost/compose.yaml
#   /opt/stacks/openpost/.env
services:
  openpost:
    image: ghcr.io/getopenpost/openpost:latest
    platform: linux/amd64
    container_name: openpost
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "8080:8080"
    volumes:
      - openpost_data:/data
    environment:
      OPENPOST_PORT: 8080
      OPENPOST_DATABASE_PATH: /data/db/openpost.db
      OPENPOST_MEDIA_PATH: /data/media
      OPENPOST_APP_URL: ${OPENPOST_APP_URL}
      OPENPOST_PUBLIC_URL: ${OPENPOST_PUBLIC_URL}
      OPENPOST_MEDIA_URL: ${OPENPOST_MEDIA_URL}
      OPENPOST_JWT_SECRET: ${OPENPOST_JWT_SECRET}
      OPENPOST_ENCRYPTION_KEY: ${OPENPOST_ENCRYPTION_KEY}
      OPENPOST_DISABLE_REGISTRATIONS: ${OPENPOST_DISABLE_REGISTRATIONS:-false}
    # Process liveness only. Gate traffic and rollouts on /api/v1/ready.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  openpost_data:
