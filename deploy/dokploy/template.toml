# Staged Dokploy catalogue submission for OpenPost.
# Not yet submitted upstream. To submit: copy docker-compose.yml,
# template.toml, meta.json, and openpost.svg into a new
# `blueprints/openpost/` folder in Dokploy/templates, open a PR, and test it
# through the PR preview link before asking for review.
[variables]
main_domain = "${domain}"
jwt_secret = "${base64:32}"
encryption_key = "${base64:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "openpost"
port = 8080
host = "${main_domain}"

[config.env]
OPENPOST_PORT = "8080"
OPENPOST_DATABASE_PATH = "/data/db/openpost.db"
OPENPOST_MEDIA_PATH = "/data/media"
OPENPOST_APP_URL = "https://${main_domain}"
OPENPOST_PUBLIC_URL = "https://${main_domain}"
OPENPOST_MEDIA_URL = "https://${main_domain}/media"
OPENPOST_JWT_SECRET = "${jwt_secret}"
OPENPOST_ENCRYPTION_KEY = "${encryption_key}"
OPENPOST_DISABLE_REGISTRATIONS = "false"
